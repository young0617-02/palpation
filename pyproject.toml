[project]
name = "edge-ai-agent-gateway"
version = "1.0.0"
description = "Edge-cloud collaborative AI Agent gateway (scheme V1.0, Phase 0)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "paho-mqtt>=2.1.0",
    "pymodbus>=3.7.0",
    "asyncua>=1.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "onnxruntime>=1.19.0",
    "onnx>=1.16.0",
    # T4 知识检索：BGE ONNX 的 fast tokenizer 直载（不引入 transformers / torch）
    "tokenizers>=0.20.0",
    "prometheus-client>=0.21.0",
    "pyyaml>=6.0.2",
    "python-ulid>=2.7.0",
    "numpy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.35",
    "psutil>=6.0.0",
    "python-multipart>=0.0.12"
]

# 端侧 LLM 可选依赖：llama-cpp-python 需 C++ 编译工具链或预编译 wheel，
# 在无编译器/离线环境中可跳过；缺失时 EdgeLLM.available=False 并降级到规则路径。
[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
    "types-psutil>=6.0.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tests", "plan"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "onnxruntime.*",
    "onnx.*",
    "tokenizers.*",
    "paho.mqtt.*",
    "pymodbus.*",
    "asyncua.*",
    "psycopg.*",
    "ulid.*",
]
ignore_missing_imports = true
